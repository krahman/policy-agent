config_id: B1
description: Single-pass RAG chain. Dense top-5 (text-embedding-3-small) -> one prompt -> structured Answer. No tools, no validation.
hypothesis: Floor for generation and for the agent comparison (H3)
dataset: policy-eval-v1
split: dev
target: b1
params:
  model: anthropic/claude-haiku-5.5
  embedding: openai/text-embedding-3-small
  k: 5
  max_tokens: 1500
  temperature: 0
evaluators: answer
repetitions: 3
max_concurrency: 3
