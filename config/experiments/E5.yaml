config_id: E5
description: "Validated chain, model A (sonnet-5.5): R5 retrieval (voyage-4) top-5, prompt answer_v1, V1-V6 with one repair, LLM judges"
hypothesis: H2 (smaller model reaches at least 90% of the larger model's groundedness at lower cost and latency); H3 floor
dataset: policy-eval-v1
split: dev
target: chain
params:
  model: anthropic/claude-sonnet-5.5
  embedding: voyageai/voyage-4
  retriever: r5
  k: 5
  max_tokens: 3000
  repair: true
evaluators: answer+judge
repetitions: 3
max_concurrency: 3
