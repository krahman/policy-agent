[project]
name = "policy-agent"
version = "0.1.0"
description = "Evidence-grounded policy research assistant (Singapore labour market)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.0",
    "langchain>=1.0,<2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "langsmith>=0.4",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "mcp>=1.30.0",
    "pandas>=3.1.0",
    "pandera>=0.35.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "jupyter>=1.1.1",
    "nbformat>=5.11.1",
    "nbconvert>=7.17.2",
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits real model APIs (deselect with -m 'not integration')"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_eda_notebook.py" = ["E501"]  # long lines inside generated notebook cells
"scripts/make_mcp_notebook.py" = ["E501"]  # long lines inside generated notebook cells
"src/policy_agent/eval/build.py" = ["E501"]  # question and answer text is data
"src/policy_agent/eval/review.py" = ["E501"]  # prose in the generated sheet header
"scripts/make_baseline_report.py" = ["E501"]  # markdown text
"scripts/analyse_retrieval.py" = ["E501"]  # markdown text
"src/policy_agent/mcp_server/*.py" = ["E501"]  # schema descriptions and SQL strings
"src/policy_agent/mcp_client.py" = ["E501"]  # error messages
"src/policy_agent/tools/*.py" = ["E501"]  # tool descriptions
"src/policy_agent/graph/*.py" = ["E501"]  # prompts, regexes and messages
"src/policy_agent/cli.py" = ["E501"]  # output formatting
"scripts/demo_scenarios.py" = ["E501"]  # scenario table
"scripts/analyse_generation.py" = ["E501"]  # markdown text
"scripts/analyse_agent.py" = ["E501"]  # markdown text
"scripts/rescore_labels.py" = ["E501"]  # markdown text
"scripts/analyse_final.py" = ["E501"]  # markdown text
"scripts/make_test_review_sheet.py" = ["E501"]  # sheet text
"scripts/compare_test_review.py" = ["E501"]  # result dict
"scripts/run_redteam.py" = ["E501"]  # case labels and check table
"tests/test_graph.py" = ["E501"]  # scripted-model fixtures
"tests/test_guardrails.py" = ["E501"]  # threat table text
"scripts/make_calibration_sheet.py" = ["E501"]  # sheet text
"scripts/calibrate_judge.py" = ["E501"]  # result dict
"notebooks/*.ipynb" = ["E501", "E702", "I001"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
